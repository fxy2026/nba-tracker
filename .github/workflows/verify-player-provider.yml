# Original successful run is retained as connection and quota evidence.
# All future provider checks use Recover NBA player data and its shared gate.
name: Legacy player connection test (retired)
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: nba-provider-first-connectivity
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Retired connection check
        run: echo 'Use Recover NBA player data for quota-gated verification.'
